name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Build browser bundles
        run: npm run build

      - name: Build Android web bundle
        run: npm run build:android

      - name: Ensure Gradle wrapper files exist
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Bootstrapping Gradle wrapper..."
            mkdir -p gradle/wrapper
            curl -sSL "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
            echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Ensure Release Keystore Exists
        env:
          BDS_KEYSTORE: ${{ secrets.BDS_KEYSTORE }}
        run: |
          if [ -n "$BDS_KEYSTORE" ]; then
            echo "$BDS_KEYSTORE" | base64 --decode > android/ci-release.jks
            echo "Keystore decoded from repository secret."
          elif [ ! -f android/ci-release.jks ]; then
            echo "Generating release keystore on the fly..."
            /usr/lib/jvm/temurin-17-jdk-amd64/bin/keytool -genkeypair \
              -v \
              -keystore android/ci-release.jks \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=venom-ai-studio, OU=Mobile, O=VenomAI, L=City, ST=State, C=US"
          else
            echo "Keystore already exists in repository."
          fi

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
        env:
          BDS_KEYSTORE_PASSWORD: ${{ secrets.BDS_KEYSTORE_PASSWORD || 'android' }}
          BDS_KEY_ALIAS: ${{ secrets.BDS_KEY_ALIAS || 'release' }}
          BDS_KEY_PASSWORD: ${{ secrets.BDS_KEY_PASSWORD || 'android' }}

      - name: Verify APK Signature
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH"
          else
            echo "No release APK found to verify."
            exit 1
          fi

      - name: Compute version and prepare artifact names
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          CHROME_ZIP=$(ls venom-ai-chrome.zip better-deepseek-chrome.zip 2>/dev/null | head -n 1)
          FIREFOX_ZIP=$(ls venom-ai-firefox.zip better-deepseek-firefox.zip 2>/dev/null | head -n 1)

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cp "$CHROME_ZIP" venom-ai-chrome-latest.zip
            cp "$FIREFOX_ZIP" venom-ai-firefox-latest.zip
            cp "$APK_SRC" venom-ai-android-latest-signed.apk
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          else
            cp "$CHROME_ZIP" "venom-ai-chrome-v${VERSION}.zip"
            cp "$FIREFOX_ZIP" "venom-ai-firefox-v${VERSION}.zip"
            cp "$APK_SRC" "venom-ai-android-v${VERSION}-signed.apk"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Venom AI Studio - Latest Automated Build
          body: |
            ## 🚀 Venom AI Studio - Latest Release
            
            This automated release is built directly from the `main` branch:
            
            - **Chrome Extension**: `venom-ai-chrome-latest.zip` (Load unpacked in `chrome://extensions`)
            - **Firefox Extension**: `venom-ai-firefox-latest.zip`
            - **Android App**: `venom-ai-android-latest-signed.apk` (Digitally signed APK ready for installation)
          files: |
            venom-ai-chrome-latest.zip
            venom-ai-firefox-latest.zip
            venom-ai-android-latest-signed.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 🚀 Venom AI Studio v${{ steps.prep.outputs.version }}
            
            Official release for version ${{ steps.prep.outputs.version }} containing signed Android APK and browser extension packages.
          files: |
            venom-ai-chrome-v${{ steps.prep.outputs.version }}.zip
            venom-ai-firefox-v${{ steps.prep.outputs.version }}.zip
            venom-ai-android-v${{ steps.prep.outputs.version }}-signed.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
