name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Build browser bundles
        run: npm run build

      - name: Build Android web bundle
        run: npm run build:android

      - name: Ensure Gradle wrapper files exist
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Bootstrapping Gradle wrapper..."
            mkdir -p gradle/wrapper
            curl -sSL "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
            echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Ensure Release Keystore Exists
        env:
          BDS_KEYSTORE: ${{ secrets.BDS_KEYSTORE }}
        run: |
          if [ -n "$BDS_KEYSTORE" ]; then
            echo "$BDS_KEYSTORE" | base64 --decode > android/ci-release.jks
            echo "Keystore decoded from repository secret."
          elif [ ! -f android/ci-release.jks ]; then
            echo "Generating release keystore on the fly..."
            /usr/lib/jvm/temurin-17-jdk-amd64/bin/keytool -genkeypair \
              -v \
              -keystore android/ci-release.jks \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=nexus-omni-studio, OU=Mobile, O=NexusOmni, L=City, ST=State, C=US"
          else
            echo "Keystore already exists in repository."
          fi

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
        env:
          BDS_KEYSTORE_PASSWORD: ${{ secrets.BDS_KEYSTORE_PASSWORD || 'android' }}
          BDS_KEY_ALIAS: ${{ secrets.BDS_KEY_ALIAS || 'release' }}
          BDS_KEY_PASSWORD: ${{ secrets.BDS_KEY_PASSWORD || 'android' }}

      - name: Verify APK Signature
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH"
          else
            echo "No release APK found to verify."
            exit 1
          fi

      - name: Generate Auto Semantic Version Tag & Prepare Assets
        id: prep
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          AUTO_TAG="v${BASE_VERSION}.${COMMIT_COUNT}"
          
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$AUTO_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          CHROME_ZIP=$(ls nexo-ai-chrome.zip venom-ai-chrome.zip nexus-omni-chrome.zip 2>/dev/null | head -n 1)
          FIREFOX_ZIP=$(ls nexo-ai-firefox.zip venom-ai-firefox.zip nexus-omni-firefox.zip 2>/dev/null | head -n 1)

          cp "$CHROME_ZIP" nexo-ai-chrome-latest.zip
          cp "$FIREFOX_ZIP" nexo-ai-firefox-latest.zip
          cp "$APK_SRC" nexo-ai-android-latest-signed.apk

          cp "$CHROME_ZIP" "nexo-ai-chrome-${AUTO_TAG}.zip"
          cp "$FIREFOX_ZIP" "nexo-ai-firefox-${AUTO_TAG}.zip"
          cp "$APK_SRC" "nexo-ai-android-${AUTO_TAG}-signed.apk"

      - name: Auto Tag Commit in Repository
        run: |
          git config user.name "Tehzeeb"
          git config user.email "xtehzeeb.x7@gmail.com"
          git tag -f ${{ steps.prep.outputs.tag }}
          git push origin ${{ steps.prep.outputs.tag }} --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release with Auto Generated Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "Nexo AI ${{ steps.prep.outputs.tag }} (Build #${{ steps.prep.outputs.commit_count }})"
          body: |
            ## 🚀 Nexo AI - Release ${{ steps.prep.outputs.tag }}
            
            **Masterminded & Developed by Tehzeeb** (Instagram: `@xtehzeeb.x`)
            
            ### 📦 Downloadable Release Packages:
            - **📱 Android App**: `nexo-ai-android-${{ steps.prep.outputs.tag }}-signed.apk` (Digitally signed APK)
            - **🌐 Chrome Extension**: `nexo-ai-chrome-${{ steps.prep.outputs.tag }}.zip`
            - **🦊 Firefox Add-on**: `nexo-ai-firefox-${{ steps.prep.outputs.tag }}.zip`
            
            ### ⚡ Built from Commit:
            - Commit: `${{ steps.prep.outputs.short_sha }}`
          files: |
            nexo-ai-android-${{ steps.prep.outputs.tag }}-signed.apk
            nexo-ai-chrome-${{ steps.prep.outputs.tag }}.zip
            nexo-ai-firefox-${{ steps.prep.outputs.tag }}.zip
            nexo-ai-android-latest-signed.apk
            nexo-ai-chrome-latest.zip
            nexo-ai-firefox-latest.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
