<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="vHexCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="bloom3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hex-outer {
      animation: hexSpinCW 9s linear infinite;
      transform-origin: 200px 200px;
    }
    .hex-inner {
      animation: hexSpinCCW 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 200px 200px;
    }
    .hex-core {
      animation: hexBreathing 2s ease-in-out infinite alternate;
      transform-origin: 200px 200px;
    }
    .orbit-dot {
      animation: orbitTrack 4s linear infinite;
      transform-origin: 200px 200px;
    }

    @keyframes hexSpinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes hexSpinCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes hexBreathing {
      0% { transform: scale(0.85); opacity: 0.7; filter: drop-shadow(0 0 10px #9333EA); }
      100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 24px #22D3EE); }
    }
    @keyframes orbitTrack {
      0% { transform: rotate(0deg) translateX(125px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(125px) rotate(-360deg); }
    }
  </style>

  <!-- Dark Shield Backdrop -->
  <polygon points="200,45 330,120 330,280 200,355 70,280 70,120" fill="#0B0F19" stroke="#1E293B" stroke-width="2" />

  <!-- Outer Animated Hexagon -->
  <g class="hex-outer">
    <polygon points="200,60 315,130 315,270 200,340 85,270 85,130" fill="none" stroke="url(#vHexGrad)" stroke-width="3" stroke-dasharray="35 15 70 20" filter="url(#bloom3)" />
    <circle cx="200" cy="60" r="5" fill="#C084FC" />
    <circle cx="315" cy="270" r="5" fill="#06B6D4" />
    <circle cx="85" cy="270" r="5" fill="#10B981" />
  </g>

  <!-- Inner Counter-Rotating Hexagon -->
  <g class="hex-inner">
    <polygon points="200,95 285,145 285,255 200,305 115,255 115,145" fill="none" stroke="url(#vHexCyan)" stroke-width="2" stroke-dasharray="20 40 10 30" opacity="0.85" filter="url(#bloom3)" />
  </g>

  <!-- Orbiting Laser Spark -->
  <circle class="orbit-dot" cx="200" cy="200" r="4.5" fill="#FFFFFF" filter="url(#bloom3)" />

  <!-- Central Venom "V" Cyber Core -->
  <g class="hex-core">
    <path d="M 150 160 L 175 175 L 200 245 L 225 175 L 250 160 L 200 265 Z" fill="url(#vHexGrad)" filter="url(#bloom3)" />
    <polygon points="200,185 215,215 200,235 185,215" fill="#FFFFFF" />
    <circle cx="200" cy="215" r="4" fill="#06B6D4" />
  </g>
</svg>