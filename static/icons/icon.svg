<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <!-- Venom Purple-Cyan Laser Gradient -->
    <linearGradient id="venomPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <linearGradient id="venomCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filter for neon bloom -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGlow)" stroke="#7C3AED" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Subtle Cyber Tech Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.3"/>

  <!-- Left Venom Wing / Fang -->
  <path d="M 120 140 C 150 180, 200 240, 256 380 C 230 310, 185 245, 145 210 Z" fill="url(#venomPurple)" filter="url(#neonBloom)" />
  <path d="M 120 140 L 195 175 L 256 380 L 220 315 L 145 210 Z" fill="url(#venomPurple)" opacity="0.9" />

  <!-- Right Venom Wing / Fang -->
  <path d="M 392 140 C 362 180, 312 240, 256 380 C 282 310, 327 245, 367 210 Z" fill="url(#venomCyan)" filter="url(#neonBloom)" />
  <path d="M 392 140 L 317 175 L 256 380 L 292 315 L 367 210 Z" fill="url(#venomCyan)" opacity="0.9" />

  <!-- Central AI Neural Core Diamond -->
  <polygon points="256,180 300,260 256,335 212,260" fill="url(#coreGlow)" filter="url(#neonBloom)"/>
  <circle cx="256" cy="260" r="12" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="256" cy="260" r="6" fill="#047857"/>
</svg>