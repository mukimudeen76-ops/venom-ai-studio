<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#161033"/>
      <stop offset="55%" stop-color="#0A0C1E"/>
      <stop offset="100%" stop-color="#030409"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="cyber" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle base -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)" stroke="#7C3AED" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Outer tech rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="14 10" opacity="0.35" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#A855F7" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Hexagonal core plate -->
  <polygon points="256,84 386,170 386,342 256,428 126,342 126,170"
           fill="rgba(129,140,248,0.08)" stroke="url(#neon)" stroke-width="3" filter="url(#soft)"/>

  <!-- Bold N monogram (neon gradient, glow) -->
  <path d="M 168 196 L 216 168 L 216 344 L 168 372 Z" fill="url(#neon)" filter="url(#glow)"/>
  <path d="M 296 168 L 344 196 L 344 372 L 296 344 Z" fill="url(#cyber)" filter="url(#glow)"/>
  <polygon points="190,182 216,168 322,340 296,354" fill="#FFFFFF" opacity="0.92" filter="url(#glow)"/>

  <!-- Center quantum node -->
  <polygon points="256,228 288,256 256,284 224,256" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="18" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="9" fill="#E879F9" filter="url(#glow)"/>

  <!-- Corner accents -->
  <circle cx="176" cy="118" r="5" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="336" cy="394" r="5" fill="#E879F9" filter="url(#glow)"/>
  <circle cx="336" cy="118" r="3.5" fill="#34D399" opacity="0.9"/>
  <circle cx="176" cy="394" r="3.5" fill="#A855F7" opacity="0.9"/>
</svg>
