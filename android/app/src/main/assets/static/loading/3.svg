<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="apexGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <style>
    .hex-spin {
      animation: hexRotate 4s linear infinite;
      transform-origin: 100px 100px;
    }
    .hex-glow {
      animation: hexPulse 1.4s ease-in-out infinite alternate;
      transform-origin: 100px 100px;
    }
    @keyframes hexRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes hexPulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 1; }
    }
  </style>

  <g class="hex-spin">
    <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="none" stroke="url(#apexGrad3)" stroke-width="3.5" stroke-dasharray="60 30" stroke-linecap="round" />
  </g>

  <g class="hex-glow">
    <polygon points="100,60 135,80 135,120 100,140 65,120 65,80" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
    <circle cx="100" cy="100" r="8" fill="#38BDF8" />
    <circle cx="100" cy="100" r="3" fill="#FFFFFF" />
  </g>
</svg>